<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">TRACE identity-preserving architecture</title>
  <desc id="desc">A left-to-right provenance ribbon turns a typed question into canonical papers, exact evidence locators, and a validated answer artifact, with a detached development policy rail and a read-only corpus foundation.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#315E8A"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#7D8792"/>
    </marker>
    <style>
      .sans { font-family: Inter, Avenir Next, Helvetica Neue, Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.4px; }
      .title { font-size: 27px; font-weight: 750; fill: #183042; }
      .subtitle { font-size: 17px; font-weight: 450; fill: #64727E; }
      .label { font-size: 18px; font-weight: 650; fill: #253B4A; }
      .small { font-size: 15px; font-weight: 500; fill: #687681; }
      .micro { font-size: 13px; font-weight: 650; fill: #6E7B86; letter-spacing: 0.25px; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    </style>
  </defs>

  <rect width="1800" height="720" fill="#FFFFFF"/>

  <!-- Detached development rail -->
  <g class="sans">
    <rect x="42" y="28" width="1716" height="82" rx="18" fill="#F6F8FA" stroke="#D9E0E5" stroke-width="1.5"/>
    <rect x="42" y="28" width="226" height="82" rx="18" fill="#EDF1F4"/>
    <text x="68" y="60" class="eyebrow" fill="#60717E">DEVELOPMENT ONLY</text>
    <text x="68" y="87" class="small">labels stop at the release gate</text>

    <g transform="translate(303,47)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#BFC9D1" stroke-width="1.5"/>
      <path d="M12 21 h16 M20 13 v16" stroke="#60717E" stroke-width="2.2" stroke-linecap="round"/>
      <text x="53" y="16" class="label">Diagnose</text>
      <text x="53" y="38" class="small">public labels + exact scorer</text>
    </g>
    <path d="M566 69 H665" stroke="#A6B2BB" stroke-width="2" marker-end="url(#arrowGray)"/>
    <g transform="translate(700,47)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#BFC9D1" stroke-width="1.5"/>
      <path d="M11 21 l6 6 13 -14" fill="none" stroke="#177C72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="16" class="label">Matched gate</text>
      <text x="53" y="38" class="small">same cohort + regression floor</text>
    </g>
    <path d="M1012 69 H1111" stroke="#A6B2BB" stroke-width="2" marker-end="url(#arrowGray)"/>
    <g transform="translate(1146,47)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#BFC9D1" stroke-width="1.5"/>
      <path d="M12 18 h16 v13 h-16 z M15 18 v-6 h10 v6" fill="none" stroke="#76558F" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="53" y="16" class="label">Freeze policy</text>
      <text x="53" y="38" class="small">code + prompts + config + hashes</text>
    </g>
    <rect x="1517" y="47" width="210" height="42" rx="21" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="1.3"/>
    <circle cx="1542" cy="68" r="7" fill="#177C72"/>
    <text x="1560" y="74" class="micro" fill="#526572">RELEASED POLICY</text>
  </g>

  <!-- Continuous provenance spine -->
  <path d="M152 516 C330 516, 345 516, 438 516 S720 516, 840 516 S1110 516, 1275 516 S1530 516, 1680 516"
        fill="none" stroke="#E6ECF0" stroke-width="20" stroke-linecap="round"/>
  <path d="M152 516 C330 516, 345 516, 438 516 S720 516, 840 516 S1110 516, 1275 516 S1530 516, 1680 516"
        fill="none" stroke="#315E8A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowNavy)"/>

  <!-- 01 Question contract -->
  <g class="sans" transform="translate(42,142)">
    <text x="0" y="18" class="eyebrow" fill="#76558F">01 / QUESTION CONTRACT</text>
    <text x="0" y="55" class="title">Make the request typed</text>
    <text x="0" y="82" class="subtitle">preserve target roles before retrieval</text>

    <g transform="translate(4,112)" filter="url(#softShadow)">
      <path d="M18 0 H267 Q283 0 283 16 V122 Q283 138 267 138 H97 L60 166 L69 138 H18 Q2 138 2 122 V16 Q2 0 18 0 Z"
            fill="#FFFFFF" stroke="#CFC4DA" stroke-width="2"/>
      <rect x="24" y="25" width="187" height="9" rx="4.5" fill="#76558F" opacity="0.84"/>
      <rect x="24" y="48" width="225" height="7" rx="3.5" fill="#D8D0E1"/>
      <rect x="24" y="67" width="195" height="7" rx="3.5" fill="#E3DDE9"/>
      <rect x="18" y="91" width="76" height="28" rx="14" fill="#F1EDF5" stroke="#CFC4DA"/>
      <text x="56" y="110" text-anchor="middle" font-size="12" font-weight="650" fill="#76558F">MC choices</text>
      <rect x="101" y="91" width="82" height="28" rx="14" fill="#F1EDF5" stroke="#CFC4DA"/>
      <text x="142" y="110" text-anchor="middle" font-size="12" font-weight="650" fill="#76558F">table schema</text>
      <rect x="190" y="91" width="77" height="28" rx="14" fill="#F1EDF5" stroke="#CFC4DA"/>
      <text x="228.5" y="110" text-anchor="middle" font-size="12" font-weight="650" fill="#76558F">answer type</text>
    </g>

    <g transform="translate(34,316)">
      <rect x="0" y="0" width="248" height="50" rx="25" fill="#76558F"/>
      <text x="124" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">target groups (internal)</text>
    </g>
  </g>

  <!-- 02 Paper identity -->
  <g class="sans" transform="translate(426,142)">
    <text x="0" y="18" class="eyebrow" fill="#315E8A">02 / PAPER IDENTITY</text>
    <text x="0" y="55" class="title">Resolve canonical sources</text>
    <text x="0" y="82" class="subtitle">routes vote without losing provenance</text>

    <g transform="translate(0,112)">
      <g class="micro">
        <rect x="0" y="2" width="92" height="32" rx="16" fill="#EAF1F7" stroke="#B8CDE0"/>
        <text x="46" y="23" text-anchor="middle" fill="#315E8A">TITLE</text>
        <rect x="0" y="44" width="92" height="32" rx="16" fill="#EAF1F7" stroke="#B8CDE0"/>
        <text x="46" y="65" text-anchor="middle" fill="#315E8A">LEXICAL</text>
        <rect x="0" y="86" width="92" height="32" rx="16" fill="#EAF1F7" stroke="#B8CDE0"/>
        <text x="46" y="107" text-anchor="middle" fill="#315E8A">CITATION</text>
        <rect x="0" y="128" width="92" height="32" rx="16" fill="#EAF1F7" stroke="#B8CDE0"/>
        <text x="46" y="149" text-anchor="middle" fill="#315E8A">OBJECT</text>
        <rect x="0" y="170" width="92" height="32" rx="16" fill="#EAF1F7" stroke="#B8CDE0"/>
        <text x="46" y="191" text-anchor="middle" fill="#315E8A">DENSE</text>
      </g>
      <path d="M98 18 C145 18 146 90 178 104 M98 60 C145 60 146 92 178 104 M98 102 H178 M98 144 C145 144 146 116 178 104 M98 186 C145 186 146 118 178 104"
            fill="none" stroke="#9DB5C9" stroke-width="2"/>
      <circle cx="185" cy="104" r="10" fill="#315E8A"/>

      <g transform="translate(154,6)" filter="url(#softShadow)">
        <path d="M38 16 H170 Q184 16 184 30 V185 Q184 199 170 199 H38 Q24 199 24 185 V30 Q24 16 38 16 Z"
              fill="#DCE8F2" stroke="#9CB8CF" stroke-width="1.5"/>
        <path d="M24 43 H184" stroke="#AAC1D4"/>
        <path d="M16 7 H148 Q162 7 162 21 V176 Q162 190 148 190 H16 Q2 190 2 176 V21 Q2 7 16 7 Z"
              fill="#FFFFFF" stroke="#789FBE" stroke-width="2"/>
        <rect x="20" y="26" width="94" height="10" rx="5" fill="#315E8A"/>
        <rect x="20" y="51" width="118" height="6" rx="3" fill="#D3DFE9"/>
        <rect x="20" y="68" width="103" height="6" rx="3" fill="#DFE7ED"/>
        <rect x="20" y="95" width="118" height="63" rx="7" fill="#F1F5F8"/>
        <path d="M34 142 L55 118 L75 132 L99 106 L128 142 Z" fill="#B9CCDB"/>
        <circle cx="121" cy="112" r="8" fill="#D17A22"/>
        <rect x="19" y="166" width="120" height="16" rx="8" fill="#315E8A"/>
        <text x="79" y="178" text-anchor="middle" font-size="12" font-weight="750" fill="#FFFFFF">CANONICAL ID</text>
      </g>
    </g>

    <g transform="translate(75,316)">
      <rect x="0" y="0" width="248" height="50" rx="25" fill="#315E8A"/>
      <text x="124" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">P = canonical papers</text>
    </g>
  </g>

  <!-- 03 Evidence grounding -->
  <g class="sans" transform="translate(838,142)">
    <text x="0" y="18" class="eyebrow" fill="#177C72">03 / EVIDENCE GROUNDING</text>
    <text x="0" y="55" class="title">Bind claims to exact objects</text>
    <text x="0" y="82" class="subtitle">paper, page, type, object ID, quote</text>

    <g transform="translate(16,108)" filter="url(#softShadow)">
      <path d="M18 0 H264 Q280 0 280 16 V214 Q280 230 264 230 H18 Q2 230 2 214 V16 Q2 0 18 0 Z"
            fill="#FFFFFF" stroke="#7EB6B1" stroke-width="2"/>
      <path d="M22 24 H104" stroke="#177C72" stroke-width="10" stroke-linecap="round"/>
      <text x="244" y="28" text-anchor="end" class="micro" fill="#177C72">PDF p. 6</text>
      <rect x="22" y="48" width="222" height="7" rx="3.5" fill="#DCE7E6"/>
      <rect x="22" y="66" width="194" height="7" rx="3.5" fill="#E5EDEC"/>
      <rect x="22" y="86" width="222" height="53" rx="7" fill="#EFF8F6" stroke="#8FC5BF" stroke-width="1.5"/>
      <rect x="35" y="99" width="67" height="7" rx="3.5" fill="#177C72" opacity="0.8"/>
      <rect x="111" y="99" width="111" height="7" rx="3.5" fill="#BEDCD8"/>
      <rect x="35" y="118" width="187" height="7" rx="3.5" fill="#D2E7E4"/>
      <rect x="22" y="158" width="67" height="42" rx="5" fill="#F7F2EA" stroke="#E1C59D"/>
      <text x="55" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#B16418">Eq. 4</text>
      <rect x="101" y="158" width="143" height="42" rx="5" fill="#F4F7F8" stroke="#CDD9DE"/>
      <path d="M116 188 L132 172 L149 185 L165 168 L185 188" fill="none" stroke="#8297A4" stroke-width="2"/>
      <rect x="196" y="170" width="35" height="17" rx="3" fill="#D7E3E8"/>
      <circle cx="263" cy="88" r="18" fill="#177C72"/>
      <path d="M254 88 l6 6 12 -14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(314,116)">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#E8F4F2" stroke="#9CCAC5"/>
      <text x="43" y="20" text-anchor="middle" class="micro" fill="#177C72">TEXT</text>
      <rect x="0" y="38" width="86" height="30" rx="15" fill="#E8F4F2" stroke="#9CCAC5"/>
      <text x="43" y="58" text-anchor="middle" class="micro" fill="#177C72">TABLE</text>
      <rect x="0" y="76" width="86" height="30" rx="15" fill="#E8F4F2" stroke="#9CCAC5"/>
      <text x="43" y="96" text-anchor="middle" class="micro" fill="#177C72">FIGURE</text>
      <rect x="0" y="114" width="86" height="30" rx="15" fill="#E8F4F2" stroke="#9CCAC5"/>
      <text x="43" y="134" text-anchor="middle" font-size="12" font-weight="650" fill="#177C72">EQUATION</text>
      <rect x="0" y="152" width="86" height="30" rx="15" fill="#E8F4F2" stroke="#9CCAC5"/>
      <text x="43" y="172" text-anchor="middle" font-size="12" font-weight="650" fill="#177C72">CITATION</text>
    </g>

    <g transform="translate(79,316)">
      <rect x="0" y="0" width="258" height="50" rx="25" fill="#177C72"/>
      <text x="129" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">E(P) = exact locators</text>
    </g>
  </g>

  <!-- 04 Answer and closure -->
  <g class="sans" transform="translate(1274,142)">
    <text x="0" y="18" class="eyebrow" fill="#D17A22">04 / ANSWER + CLOSURE</text>
    <text x="0" y="55" class="title">Assemble, check, seal</text>
    <text x="0" y="82" class="subtitle">source-exact values, scorer-exact form</text>

    <g transform="translate(0,116)">
      <g filter="url(#softShadow)">
        <rect x="0" y="0" width="165" height="92" rx="13" fill="#FFFFFF" stroke="#D6B689" stroke-width="1.8"/>
        <text x="18" y="25" class="micro" fill="#B16418">MULTIPLE CHOICE</text>
        <circle cx="24" cy="51" r="8" fill="#FFFFFF" stroke="#C8A97B"/>
        <circle cx="24" cy="51" r="4" fill="#D17A22"/>
        <rect x="43" y="45" width="95" height="10" rx="5" fill="#E9D8BF"/>
        <circle cx="24" cy="73" r="8" fill="#FFFFFF" stroke="#D9C9B2"/>
        <rect x="43" y="68" width="72" height="10" rx="5" fill="#EFE5D6"/>

        <rect x="0" y="112" width="165" height="112" rx="13" fill="#FFFFFF" stroke="#D6B689" stroke-width="1.8"/>
        <text x="18" y="137" class="micro" fill="#B16418">TYPED TABLE</text>
        <path d="M18 151 H147 V205 H18 Z M18 169 H147 M18 187 H147 M68 151 V205"
              fill="none" stroke="#CCB38E" stroke-width="1.5"/>
        <rect x="72" y="173" width="54" height="9" rx="4.5" fill="#D17A22" opacity="0.78"/>
        <rect x="72" y="191" width="39" height="9" rx="4.5" fill="#E7D1B2"/>
      </g>

      <path d="M177 49 C213 49 210 96 237 108 M177 168 C213 168 210 120 237 108"
            fill="none" stroke="#C89F66" stroke-width="2.2"/>
      <circle cx="243" cy="108" r="9" fill="#D17A22"/>

      <g transform="translate(219,23)" filter="url(#softShadow)">
        <path d="M78 0 L147 24 V91 C147 135 118 163 78 181 C38 163 9 135 9 91 V24 Z"
              fill="#FFF9F1" stroke="#D17A22" stroke-width="2.4"/>
        <path d="M48 86 l20 20 42 -49" fill="none" stroke="#177C72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="33" y="135" width="90" height="24" rx="12" fill="#D17A22"/>
        <text x="78" y="152" text-anchor="middle" font-size="12" font-weight="750" fill="#FFFFFF">VALIDATED</text>
      </g>
    </g>

    <g transform="translate(55,316)">
      <rect x="0" y="0" width="306" height="50" rx="25" fill="#D17A22"/>
      <text x="153" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">{P, E(P), A} = frozen JSONL</text>
    </g>
  </g>

  <!-- Transition labels carried by the ribbon -->
  <g class="sans">
    <circle cx="357" cy="516" r="8" fill="#FFFFFF" stroke="#315E8A" stroke-width="3"/>
    <text x="357" y="551" text-anchor="middle" class="micro" fill="#526B7E">ROUTE</text>
    <circle cx="807" cy="516" r="8" fill="#FFFFFF" stroke="#315E8A" stroke-width="3"/>
    <text x="807" y="551" text-anchor="middle" class="micro" fill="#526B7E">LOCALIZE</text>
    <circle cx="1250" cy="516" r="8" fill="#FFFFFF" stroke="#315E8A" stroke-width="3"/>
    <text x="1250" y="551" text-anchor="middle" class="micro" fill="#526B7E">ANSWER</text>
    <text x="150" y="551" text-anchor="middle" class="micro" fill="#526B7E">CONTRACT</text>
    <text x="1680" y="551" text-anchor="middle" class="micro" fill="#526B7E">SEAL</text>
  </g>

  <!-- Read-only corpus foundation -->
  <g class="sans">
    <rect x="42" y="592" width="1716" height="92" rx="18" fill="#F7F9FA" stroke="#D9E0E5" stroke-width="1.5"/>
    <g transform="translate(68,610)">
      <rect x="9" y="4" width="35" height="46" rx="4" fill="#FFFFFF" stroke="#9EABB4"/>
      <rect x="3" y="10" width="35" height="46" rx="4" fill="#FFFFFF" stroke="#9EABB4"/>
      <path d="M11 23 H29 M11 32 H29 M11 41 H23" stroke="#9EABB4" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="131" y="625" class="eyebrow" fill="#667680">READ-ONLY CORPUS FOUNDATION</text>
    <text x="131" y="654" class="label">27,487-paper corpus</text>
    <text x="370" y="654" class="small">pages</text>
    <circle cx="444" cy="649" r="3" fill="#A7B2BA"/>
    <text x="465" y="654" class="small">printed objects</text>
    <circle cx="605" cy="649" r="3" fill="#A7B2BA"/>
    <text x="626" y="654" class="small">aliases</text>
    <circle cx="705" cy="649" r="3" fill="#A7B2BA"/>
    <text x="726" y="654" class="small">citations</text>
    <circle cx="821" cy="649" r="3" fill="#A7B2BA"/>
    <text x="842" y="654" class="small">dense index</text>
    <rect x="1151" y="614" width="576" height="48" rx="24" fill="#FFFFFF" stroke="#CAD3DA"/>
    <path d="M1179 638 h34" stroke="#315E8A" stroke-width="3" marker-end="url(#arrowNavy)"/>
    <text x="1231" y="644" class="small">frozen inference</text>
    <path d="M1398 638 h34" stroke="#7D8792" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
    <text x="1450" y="644" class="small">read-only dependency</text>
    <circle cx="1674" cy="638" r="7" fill="#177C72"/>
    <text x="1692" y="644" class="small">hash-bound</text>
  </g>
  <path d="M646 592 C646 570 645 563 645 536" fill="none" stroke="#8796A1" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1043 592 C1043 570 1042 563 1042 536" fill="none" stroke="#8796A1" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
</svg>
